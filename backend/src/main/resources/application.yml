spring:
  application:
    name: armazem-ingredientes
  datasource:
    url: jdbc:h2:file:./data/armazem;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc.time_zone: America/Sao_Paulo
      jakarta.persistence.lock.timeout: 8000
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

server:
  port: 8080

app:
  jwt:
    segredo: ${JWT_SECRET:armazem-vega-segredo-jwt-com-32-caracteres-minimo}
    expiracao-minutos: 480
  cors:
    origens: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

info:
  app:
    nome: Armazém de Ingredientes
    descricao: API do desafio técnico Vega com arquitetura hexagonal
